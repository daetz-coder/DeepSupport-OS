# Root stays the existing homepage; DeepSupport OS is under /DeepSupport-OS/.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    location = / {
        return 301 /portfolio/;
    }

    location /portfolio/ {
        alias /var/www/homepage/portfolio/;
        try_files $uri $uri/ /portfolio/index.html;
        limit_req zone=global_limit burst=20 nodelay;
    }

    location = /DeepSupport-OS {
        return 301 /DeepSupport-OS/;
    }

    location /DeepSupport-OS/ {
        proxy_pass http://127.0.0.1:5173/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
