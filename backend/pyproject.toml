[project]
name = "deepsupport-os"
version = "0.1.0"
description = "Open-source enterprise IT support agent harness powered by Deep Agents"
readme = "README.md"
authors = [
    { name = "zhanyong", email = "3446914219@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.3",
    "faker>=40.36.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.6",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
deepsupport-os = "deepsupport_os:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
