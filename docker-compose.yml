services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./skills:/app/skills
    environment:
      - DATABASE_URL=sqlite:///data/deepsupport.db
      - WORKSPACE_DIR=workspace

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
