services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./skills:/app/skills
      - ./config:/app/config
      - ./memory:/app/memory
    environment:
      - DATABASE_URL=sqlite:///data/deepsupport.db
      - WORKSPACE_DIR=workspace
      - MCP_SERVERS_CONFIG=config/mcp_servers.json
      - API_HOST=0.0.0.0
      # Reach host-side RAGLab / Ollama from the container (Docker Desktop)
      - RAGLAB_BASE_URL=http://host.docker.internal:8001
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
