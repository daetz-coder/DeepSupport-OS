services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./skills:/app/skills
      - ./config:/app/config
      - ./memory:/app/memory
    environment:
      - DATABASE_URL=sqlite:///data/deepsupport.db
      - WORKSPACE_DIR=workspace
      - MCP_SERVERS_CONFIG=config/mcp_servers.json

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
