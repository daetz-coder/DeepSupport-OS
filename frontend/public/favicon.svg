<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Matches App.vue .brand-mark: dark zinc tile + white DS -->
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27272a"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#ds-bg)"/>
  <text
    x="16"
    y="21.5"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="0.04em"
    fill="#ffffff"
  >DS</text>
</svg>
